# AI Quant Trade — Docker Compose 一键部署
# M5: 统一 Python 3.13 + Nginx 反向代理 + Redis 可选
# 用法：docker compose up -d
# 生产：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # PostgreSQL 数据库
  db:
    image: postgres:16-alpine
    container_name: ai_quant_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_NAME:-ai_quant_trade}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存（可选 — 用于未来 session 共享/限流）
  redis:
    image: redis:7-alpine
    container_name: ai_quant_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 后端 API — M5: Python 3.13 + 4 workers
  backend:
    build: ./backend
    container_name: ai_quant_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-root}:${DB_PASSWORD:-root}@db:5432/${DB_NAME:-ai_quant_trade}
      - REDIS_URL=redis://redis:6379/0
      - EXCHANGE_API_KEY=${EXCHANGE_API_KEY}
      - EXCHANGE_SECRET=${EXCHANGE_SECRET}
      - EXCHANGE_PASSPHRASE=${EXCHANGE_PASSPHRASE}
      - EXCHANGE_TESTNET=${EXCHANGE_TESTNET:-true}
      - EXCHANGE_NAME=${EXCHANGE_NAME:-okx}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - MAX_ORDER_AMOUNT_USDT=${MAX_ORDER_AMOUNT_USDT:-200}
      - MAX_TOTAL_POSITION_USDT=${MAX_TOTAL_POSITION_USDT:-2000}
      - LIVE_SYMBOL_WHITELIST=${LIVE_SYMBOL_WHITELIST:-BTC/USDT,ETH/USDT,SOL/USDT}
      - DISABLE_AI_IN_LIVE=${DISABLE_AI_IN_LIVE:-true}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - DEBUG=${DEBUG:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # 前端 — M5: 环境变量外部注入
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost}
        - NEXT_PUBLIC_WS_URL=${PUBLIC_WS_URL:-ws://localhost/ws/ticker}
    container_name: ai_quant_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # Nginx 反向代理 — M5: 统一入口
  nginx:
    image: nginx:alpine
    container_name: ai_quant_nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "5"

volumes:
  pgdata:
