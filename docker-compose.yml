# AI Quant Trade — Docker Compose 一键部署
# M5: 统一 Python 3.13 + Nginx 反向代理 + Redis 可选
# 用法：docker compose up -d
# 生产：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # PostgreSQL 数据库
  db:
    image: postgres:16-alpine
    container_name: ai_quant_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_NAME:-ai_quant_trade}
    ports:
      - "127.0.0.1:5432:5432"  # v2.0: 仅本机可访问，避免公网暴露
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis 缓存（可选 — 用于未来 session 共享/限流）
  redis:
    image: redis:7-alpine
    container_name: ai_quant_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"  # v2.0: 仅本机可访问
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # 后端 API — M5: Python 3.13 + 4 workers
  backend:
    build: ./backend
    container_name: ai_quant_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-root}:${DB_PASSWORD:-root}@db:5432/${DB_NAME:-ai_quant_trade}
      - REDIS_URL=redis://redis:6379/0
      - EXCHANGE_API_KEY=${EXCHANGE_API_KEY}
      - EXCHANGE_SECRET=${EXCHANGE_SECRET}
      - EXCHANGE_PASSPHRASE=${EXCHANGE_PASSPHRASE}
      - EXCHANGE_TESTNET=${EXCHANGE_TESTNET:-true}
      - EXCHANGE_NAME=${EXCHANGE_NAME:-okx}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - MAX_ORDER_AMOUNT_USDT=${MAX_ORDER_AMOUNT_USDT:-200}
      - MAX_TOTAL_POSITION_USDT=${MAX_TOTAL_POSITION_USDT:-2000}
      - LIVE_SYMBOL_WHITELIST=${LIVE_SYMBOL_WHITELIST:-BTC/USDT,ETH/USDT,SOL/USDT}
      - DISABLE_AI_IN_LIVE=${DISABLE_AI_IN_LIVE:-true}
      - HTTPS_PROXY=${DOCKER_HTTPS_PROXY:-}
      - HTTP_PROXY=${DOCKER_HTTP_PROXY:-}
      - DEBUG=${DEBUG:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "from http.client import HTTPConnection; c=HTTPConnection('127.0.0.1',8000,timeout=5); c.request('GET','/api/health'); r=c.getresponse(); exit(0 if r.status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # 前端 — M5: 环境变量外部注入
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${PUBLIC_API_URL:-http://localhost}
        - NEXT_PUBLIC_WS_URL=${PUBLIC_WS_URL:-ws://localhost/ws/ticker}
    container_name: ai_quant_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # Nginx 反向代理 — M5: 统一入口
  nginx:
    image: nginx:alpine
    container_name: ai_quant_nginx
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro  # v1.2: SSL 证书（只读）
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "30m"
        max-file: "5"

  # v1.2: Prometheus 指标采集
  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: ai_quant_prometheus
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:9090:9090"  # v2.0: 仅本机可访问
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules.yml:/etc/prometheus/rules.yml:ro  # v1.2: 告警规则
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # v1.2: Grafana 可视化仪表板
  grafana:
    image: grafana/grafana:11.8.0
    container_name: ai_quant_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3030:3000"  # v2.0: 仅本机可访问
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=""
    volumes:
      - ./deploy/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  # v1.2: Alertmanager 告警接收与路由
  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: ai_quant_alertmanager
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:9093:9093"  # v2.0: 仅本机可访问
    volumes:
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # v1.2: Certbot 用于 SSL 证书签发（按需运行，非常驻）
  certbot:
    image: certbot/certbot:latest
    container_name: ai_quant_certbot
    profiles: ["ssl"]
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: ["echo", "Certbot ready"]

volumes:
  pgdata:
  prometheus_data:
  grafana_data:
  certbot_certs:
  certbot_www:
  alertmanager_data:
