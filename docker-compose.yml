# AI Quant Trade — Docker Compose 一键部署
# 用法：docker-compose up -d
version: "3.9"

services:
  # PostgreSQL 数据库
  db:
    image: postgres:16-alpine
    container_name: ai_quant_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_NAME:-ai_quant_trade}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/backup:/backup  # 备份挂载点
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-root}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端 API
  backend:
    build: ./backend
    container_name: ai_quant_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-root}:${DB_PASSWORD:-root}@db:5432/${DB_NAME:-ai_quant_trade}
      - EXCHANGE_API_KEY=${EXCHANGE_API_KEY}
      - EXCHANGE_SECRET=${EXCHANGE_SECRET}
      - EXCHANGE_PASSPHRASE=${EXCHANGE_PASSPHRASE}
      - EXCHANGE_TESTNET=${EXCHANGE_TESTNET:-true}
      - EXCHANGE_NAME=${EXCHANGE_NAME:-okx}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - MAX_ORDER_AMOUNT_USDT=${MAX_ORDER_AMOUNT_USDT:-200}
      - MAX_TOTAL_POSITION_USDT=${MAX_TOTAL_POSITION_USDT:-2000}
      - LIVE_SYMBOL_WHITELIST=${LIVE_SYMBOL_WHITELIST:-BTC/USDT,ETH/USDT,SOL/USDT}
      - DISABLE_AI_IN_LIVE=${DISABLE_AI_IN_LIVE:-true}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - DEBUG=${DEBUG:-false}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  # 前端
  frontend:
    build: ./frontend
    container_name: ai_quant_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws/ticker
    ports:
      - "3000:3000"

volumes:
  pgdata:
