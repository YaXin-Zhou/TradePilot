# Alembic config - AI Quant Trade (N4)
# Usage:
#   alembic upgrade head
#   alembic downgrade -1
#   alembic revision --autogenerate -m "description"
#   alembic current
#   alembic history

[alembic]
# migration scripts directory
script_location = alembic

# template (contains down_revision/upgrade/downgrade skeleton)
script_template = alembic/script.py.mako

# version table name (default alembic_version, no need to change)
# version_table = alembic_version

# database URL (actually read from settings by env.py, placeholder here)
# must be a sync URL; env.py converts asyncpg -> psycopg2
sqlalchemy.url = postgresql://root:root@localhost:5432/ai_quant_trade

# timezone
timezone = UTC

# migration file naming: 3-digit rev + slug (chronological)
file_template = %%(rev)s_%%(slug)s

# output encoding
output_encoding = utf-8

[post_write_hooks]
# optional post-generation formatting hooks

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
