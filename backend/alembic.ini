# Alembic 配置 — AI 量化交易系统（N4）
# 用法：
#   alembic upgrade head      # 升级到最新迁移
#   alembic downgrade -1      # 回滚一个版本
#   alembic revision --autogenerate -m "描述"  # 自动生成迁移
#   alembic current           # 查看当前版本
#   alembic history           # 查看迁移历史

[alembic]
# 迁移脚本目录
script_location = alembic

# 模板（包含 down_revision/upgrade/downgrade 骨架）
script_template = alembic/script.py.mako

# 版本表名（默认 alembic_version，无需修改）
# version_table = alembic_version

# 数据库 URL（实际由 env.py 从 settings 读取，此处仅占位）
# 需要是同步 URL（alembic 原生同步），env.py 会转换 asyncpg → psycopg2
sqlalchemy.url = postgresql://root:root@localhost:5432/ai_quant_trade

# 时区
timezone = UTC

# 迁移文件命名：3 位数字 + 描述（按时间顺序）
file_template = %%(rev)s_%%(slug)s

# 输出格式
output_encoding = utf-8

[post_write_hooks]
# 迁移文件生成后格式化（可选）

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
